name = "kofhk-chat"
main = "index.js"
compatibility_date = "2025-01-01"
account_id = "2145058745a338fb743534c2d3528cf8"

# Route: all kofhk.com requests
# /api/* → handled by worker (chat, rate limiting)
# /* (static) → pass-through proxy with security headers injected
routes = [
  { pattern = "kofhk.com/*", zone_name = "kofhk.com" }
]

# Durable Object for cross-edge rate limiting
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiter"]

# Environment variables (set secret with: wrangler secret put OPENROUTER_API_KEY)
# [vars]
# No public vars needed — API key is a secret
