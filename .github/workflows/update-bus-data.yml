name: 每週自動更新巴士路線數據

on:
  schedule:
    # 每週日 UTC 2:00（香港時間 10:00）執行
    - cron: '0 2 * * 0'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  update-bus-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 執行巴士數據更新
        run: python update_bus_data.py

      - name: 檢查是否有變更
        id: check_changes
        run: |
          if git diff --quiet -- 'data/*.json'; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to bus data"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Bus data has changes"
          fi

      - name: 提交更新
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kmb_routes.json data/kmb_route_stops.json data/kmb_stops.json data/ctb_routes.json
          git commit -m "🚌 每週自動更新巴士路線數據 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
