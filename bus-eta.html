<script>const CFG = {
KMB: {
label:'九巴', color:'#e8302a',
base:'https://data.etabus.gov.hk/v1/transport/kmb',
routeEp:'/route', routeStopEp:'/route-stop', stopEp:'/stop',
etaEp:(s,r,t)=>`/eta/${s}/${r}/${t}`,
},
CTB: {
label:'城巴', color:'#0076c0',
base:'https://rt.data.gov.hk/v2/transport/citybus',
routeEp:()=>'/route/ctb',
routeStopEp:(r,d)=>`/route-stop/ctb/${r}/${d}`,
stopEp:s=>`/stop/${s}`,
etaEp:(s,r)=>`/eta/ctb/${s}/${r}`,
},
LRT: {
label:'輕鐵', color:'#c49b1a',
etaBase:'https://rt.data.gov.hk/v1/transport/mtr/lrt',
etaEp:stopId=>`/getSchedule?station_id=${encodeURIComponent(stopId)}`,
},
GMB: {
label:'小巴', color:'#7c3aed',
base:'https://proxy.cors.sh/https://data.etagmb.gov.hk',
routeEp:'/route',
routeDetailEp:(region,code)=>`/route/${region}/${code}`,
routeStopEp:(routeId,routeSeq)=>`/route-stop/${routeId}/${routeSeq}`,
etaEp:(routeId,stopId)=>`/eta/route-stop/${routeId}/${stopId}`,
},
};
const API_TIMEOUT = 60000;
const S = {
co: 'KMB',
routes: [],
routeStops: {},
stops: {},
selectedRoute: null,
selectedBound: null,
selectedRouteData: null,
directionList: [],
stopList: [],
timer: null,
countdown: 30,
dataLoaded: false,
dataLoading: false,
lrtStations: [],
lrtRoutes: [],
lrtSelectedStation: null,
gmbRouteMap: {},
gmbRouteDetails: null,
gmbAllDetails: null,
gmbStopsCache: null,
};
async function api(url, to=API_TIMEOUT) {
const c = new AbortController();
const t = setTimeout(()=>c.abort(), to);
try {
const r = await fetch(url, {signal:c.signal});
if (!r.ok) throw new Error(`HTTP ${r.status}`);
return await r.json();
} catch(e) {
if (e.name === 'AbortError') throw new Error('請求超時 (Request timeout)');
throw e;
} finally { clearTimeout(t); }
}
async function selectCo(co) {
stopTimer();
S.co = co;
S.routes = [];
S.selectedRoute = null;
S.selectedBound = null;
S.routeStops = {};
S.stops = {};
S.stopList = [];
S.directionList = [];
S.dataLoaded = false;
S.dataLoading = false;
S.gmbRouteMap = {};
S.gmbRouteDetails = null;
S.gmbAllDetails = null;
S.gmbStopsCache = null;
S.lrtSelectedStation = null;
document.querySelectorAll('.company-btn').forEach(b=>
b.classList.toggle('active', b.dataset.co===co));
document.getElementById('directionSection').classList.remove('visible');
document.getElementById('routeHeader').classList.remove('visible');
document.getElementById('refreshBtn').classList.remove('visible');
showWelcome();
hideError();
document.getElementById('routeInput').value = '';
document.getElementById('routeInput').disabled = false;
document.getElementById('routeInput').placeholder =
co==='KMB'?'輸入路線號碼 e.g. 1A, 960, 968':
co==='CTB'?'輸入路線號碼 e.g. 1, 10, 970X, A11':
co==='GMB'?'輸入路線號碼 e.g. 1A, 20M, 44A':
co==='LRT'?'輸入車站名稱 e.g. 兆康, 屯門, 天水圍':
'輸入路線號碼 e.g. 1A, 960, K51';
closeAC();
setStatus('載入路線列表...', true);
try {
if (co === 'KMB') {
const d = await fetch('data/kmb_routes.json').then(r=>r.json());
S.routes = d.data;
S.dataLoaded = false;
} else if (co === 'CTB') {
const d = await fetch('data/ctb_routes.json').then(r=>r.json());
S.routes = d.data||[];
} else if (co === 'LRT') {
setStatus('載入輕鐵車站...', true);
try {
const [st, rd] = await Promise.all([
fetch('data/lrt_stations.json').then(r=>r.json()),
fetch('data/lrt_routes.json').then(r=>r.json()),
]);
S.lrtStations = st||[];
S.lrtRoutes = rd||[];
clearStatus();
} catch(e) {
clearStatus();
showError('無法載入輕鐵資料: '+e.message);
}
} else if (co === 'GMB') {
setStatus('載入小巴路線...', true);
try {
const d = await fetch('data/gmb_routes.json').then(r=>r.json());
S.gmbAllDetails = d.data || [];
S.gmbRouteMap = {};
S.routes = [];
S.gmbAllDetails.forEach(dir => {
const key = dir.route_code;
if (!S.gmbRouteMap[key]) {
S.gmbRouteMap[key] = [];
S.routes.push({ route: key, region: dir.region, co: 'GMB' });
}
if (!S.gmbRouteMap[key].includes(dir.region)) {
S.gmbRouteMap[key].push(dir.region);
}
});
S.routes.sort((a,b)=>a.route.localeCompare(b.route));
clearStatus();
} catch(e) {
clearStatus();
showError('無法載入小巴路線: '+e.message);
}
} else {

let _etaAborter = null;
async function fetchAndUpdateETA() {
  if (_etaAborter) try { _etaAborter.abort(); } catch(_){ }
  if (S.co === 'LRT') {
    if (!S.lrtSelectedStation) return;
    const icon = document.getElementById('refreshIcon');
    if (icon) icon.classList.add('spinning');
    await fetchLrtETA();
    if (icon) icon.classList.remove('spinning');
    return;
  }
  if (!S.stopList.length || !S.selectedBound) return;
  const aborter = new AbortController();
  _etaAborter = aborter;
  const icon = document.getElementById('refreshIcon');
  if (icon) icon.classList.add('spinning');
  try {
    const etaMap = {};
    const stopList = S.stopList;
    const route = S.selectedRoute;
    // Fetch ETAs one stop at a time. KMB's API drops most connections
    // when hit with many concurrent requests, which left every stop
    // showing no ETA. Serialising with a small delay + retry fixes it.
    async function fetchStopEta(s, attempt) {
      try {
        let d;
        if (S.co === 'KMB') {
          d = await api(CFG.KMB.base+CFG.KMB.etaEp(s.stopId, route, '1'), 12000);
          return {stopId: s.stopId, etas: d.data||[]};
        } else if (S.co === 'CTB') {
          d = await api(CFG.CTB.base+CFG.CTB.etaEp(s.stopId, route), 12000);
          return {stopId: s.stopId, etas: d.data||[]};
        } else if (S.co === 'LRT') {
          return {stopId: s.stopId, etas: []};
        } else if (S.co === 'GMB') {
          const rd = S.selectedRouteData;
          d = await api(CFG.GMB.base+CFG.GMB.etaEp(rd.routeId, s.stopId), 12000);
          const gmbResults = (d.data || []);
          const etas = [];
          gmbResults.forEach(r => {
            if (r.stop_seq === s.seq && r.route_seq === rd.routeSeq) {
              (r.eta||[]).forEach(e => {
                etas.push({eta: e.timestamp, rmk_tc: e.remarks_tc||'', diff: e.diff});
              });
            }
          });
          return {stopId: s.stopId, etas: etas};
        }
        return {stopId: s.stopId, etas: []};
      } catch(e) {
        if (attempt <= 0) return {stopId: s.stopId, etas: []};
        await new Promise(r => setTimeout(r, 500));
        return fetchStopEta(s, attempt - 1);
      }
    }
    for (const s of stopList) {
      if (aborter.signal.aborted) break;
      const r = await fetchStopEta(s, 2);
      etaMap[r.stopId] = r.etas;
      await new Promise(res => setTimeout(res, 150));
    }
    if (aborter.signal.aborted) { if (icon) icon.classList.remove('spinning'); return; }
    Object.keys(etaMap).forEach(id => {
      etaMap[id] = etaMap[id].filter(e => {
        if (S.co === 'KMB') return e.route === route && e.dir === S.selectedBound;
        if (S.co === 'CTB') {
          const dirMap = {outbound:'O', inbound:'I'};
          return e.route === route && e.dir === dirMap[S.selectedBound];
        }
        return true;
      });
    });
    stopList.forEach(s => {
      const el = document.getElementById('eta-'+s.stopId);
      if (!el) return;
      const etas = etaMap[s.stopId] || [];
      if (etas.length) {
        el.innerHTML = '';
        etas.slice(0,3).forEach(e => el.appendChild(createEtaBadge(e.eta, e.rmk_tc)));
      } else {
        el.innerHTML = '<span class="eta-none">—</span>';
      }
    });
    setUpdateTime();
  } catch(e) {
  } finally {
    if (_etaAborter === aborter) _etaAborter = null;
    if (icon) icon.classList.remove('spinning');
  }
}

function getMin(etaStr) {
if (!etaStr) return {display:'—', cls:'eta-scheduled', label:'預定'};
const min = (new Date(etaStr) - new Date()) / 60000;
if (!isFinite(min) || min < 0) return {display:'—', cls:'eta-scheduled', label:'預定'};
if (min < 1) return {display:'<1', cls:'eta-arriving', label:'到站'};
if (min < 4) return {display:Math.round(min)+"'", cls:'eta-arriving', label:'到站'};
if (min < 8) return {display:Math.round(min)+"'", cls:'eta-soon', label:'即將'};
if (min < 20) return {display:Math.round(min)+"'", cls:'eta-coming', label:' coming'};
if (min < 60) return {display:Math.round(min)+"'", cls:'eta-scheduled', label:' scheduled'};
const d = new Date(etaStr);
return {display:d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'), cls:'eta-scheduled', label:'預定'};
}
