<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>第30章 · 輪迴之秘 - 萬古塵埃</title><meta name="description" content="「輪迴之主……隕落於此。葉塵站在石碑前，心中波瀾起伏。輪迴之主——這個稱號，和九世輪迴有什麼關係。自己經歷的九世輪迴，難道和這個隕落的輪迴之主有關。他伸出手，想要觸碰石碑—— 就在他的指尖即將碰到石碑表面的瞬間，石碑上的符文旅然亮起。紫色的光芒如同火焰般燃燒起來，一股龐大的資訊洪流衝入他的識海。轟。"><link rel="canonical" href="https://kofhk.com/chapter-30.html"><link rel="prev" href="https://kofhk.com/chapter-29.html"><link rel="next" href="https://kofhk.com/chapter-31.html">
