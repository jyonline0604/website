name: 每日自動更新數據

on:
  schedule:
    # 每天 UTC 時間 2:00 和 14:00 自動執行（香港時間 10:00 和 22:00）
    - cron: '0 2,14 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴
        run: |
          pip install yfinance

      - name: 執行更新腳本（含自動重試）
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            echo "🔄 第 $i 次執行..."
            python update_data.py && break
            if [ $i -eq $max_retries ]; then
              echo "❌ 所有 $max_retries 次重試均失敗"
              exit 1
            fi
            echo "⚠️ 第 $i 次失敗，10 秒後重試..."
            sleep 10
          done

      - name: 檢查是否有變更
        id: check_changes
        run: |
          if git diff --quiet -- '*.json'; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📭 無需更新，JSON 文件未變化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 JSON 文件有變更"
          fi

      - name: 提交更新
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json finance-news.json finance-data.json
          git commit -m "📅 每日自動更新新聞和市場數據 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
