<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="canonical" href="{canonical}">
    <link rel="prev" href="{prev_url}">
    <link rel="next" href="{next_url}">
    <link rel="stylesheet" href="assets/chapter.css">
</head>
<body>
    <div class="top-bar">
        <a href="chapters.html">← 返回目錄</a>
        <div class="controls">
            <select id="themeSelect">
                <option value="light">☀️</option>
                <option value="sepia">📜</option>
                <option value="sky">🌤️</option>
                <option value="green">🌿</option>
                <option value="dark">🌙</option>
                <option value="navy">🌌</option>
            </select>
            <select id="fontSize">
                <option value="14px">A</option>
                <option value="18px" selected>A</option>
                <option value="22px">A</option>
            </select>
        </div>
    </div>
    <h1>{chapter_title}</h1>
    <main>
{content}
    </main>
    <nav class="nav">
        <a href="{prev_url}" id="prevLink">← 上一章</a>
        <a href="chapters.html">📖 返回目錄</a>
        <a href="https://kofhk.com/manga/chapter-{CHAPTER_NUM}/" class="manga-btn">🎨 漫畫版</a>
        <a href="{next_url}" id="nextLink">下一章 →</a>
    </nav>
    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
    <script src="chapter-nav.js"></script>
    <script src="assets/chapter.js" defer></script>
</body>
</html>
