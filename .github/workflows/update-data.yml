name: 每日自動更新數據

on:
  schedule:
    # 每天 UTC 時間 1:00、7:00 和 13:00 自動執行（香港時間 09:00、15:00 和 21:00）
    - cron: '0 1,7,13 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴
        run: |
          pip install yfinance

      - name: 執行更新腳本（含自動重試）
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            echo "🔄 第 $i 次執行..."
            python update_data.py && break
            if [ $i -eq $max_retries ]; then
              echo "❌ 所有 $max_retries 次重試均失敗"
              exit 1
            fi
            echo "⚠️ 第 $i 次失敗，10 秒後重試..."
            sleep 10
          done

      - name: 檢查是否有變更
        id: check_changes
        run: |
          # 同步重新生成 sitemap.xml 與 feed.xml（跟隨章節數據）
          set +e  # 容許 python script 個別失敗而唔 abort 成個 step
          python scripts/generate_sitemap.py
          python scripts/generate_rss.py
          # 用 git status --porcelain 取代 git diff --quiet — handles fresh untracked files (新 generate 嘅 sitemap.xml/feed.xml 唔會被 diff 偵測到)
          # git diff 只睇已 tracked 嘅 file → fresh generate 後 first run 會 miss
          if git status --porcelain -- '*.json' 'sitemap.xml' 'feed.xml' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📦 數據文件有變更"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📭 無需更新，數據文件未變化"
          fi

      - name: 提交更新
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json finance-news.json finance-data.json sitemap.xml feed.xml
          git commit -m "📅 每日自動更新新聞、市場數據、sitemap 與 RSS ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
