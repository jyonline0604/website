<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景圖測試</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:sans-serif;background:#0a0a0f;color:#fff}
  h1{text-align:center;padding:30px;font-size:1.8rem;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,0.3)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 20px 40px;max-width:1400px;margin:0 auto}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .card{border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.15)}
  .card-title{padding:14px 20px;font-size:1.2rem;font-weight:600;background:rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.1)}
  .preview{height:50vh;min-height:300px;position:relative;display:flex;align-items:center;justify-content:center}
  .preview p{background:rgba(0,0,0,0.5);padding:12px 24px;border-radius:8px;font-size:1rem;backdrop-filter:blur(4px)}
  .hero-home{background:url('assets/images/hero-bg.jpg') center top 5cm/cover no-repeat}
  .hero-chapters{background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.5)),url("assets/chapters-new-bg.jpg") center/cover no-repeat}
  .footer{text-align:center;padding:20px;color:rgba(255,255,255,0.5);font-size:0.9rem}
</style>
</head>
<body>
<h1>🖼️ 背景圖測試頁</h1>
<div class="grid">
  <div class="card">
    <div class="card-title">🏠 首頁 (hero-bg.jpg)</div>
    <div class="preview hero-home"><p>assets/images/hero-bg.jpg</p></div>
  </div>
  <div class="card">
    <div class="card-title">📖 章節目錄 (chapters-new-bg.jpg)</div>
    <div class="preview hero-chapters"><p>assets/chapters-new-bg.jpg</p></div>
  </div>
</div>
<div class="footer">kofhk.com · 背景圖測試 · 2026-07-11</div>
</body>
</html>
