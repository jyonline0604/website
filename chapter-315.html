<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第315章 · 鑰匙的共鳴 - 萬古塵埃</title>
    <link rel="canonical" href="https://kofhk.com/chapter-315.html">
    <link rel="prev" href="https://kofhk.com/chapter-314.html">
    <link rel="next" href="https://kofhk.com/chapter-316.html">
    <style>



        :root {
            --bg: #FAFBFC;
            --text: #1F2937;
            --accent: #6366F1;
            --border: #E5E7EB;
            --panel-bg: #FFFFFF;
            --font-size: 18px;
            --line-height: 1.8;
        }
        [data-theme="light"] {
            --bg: #FAFBFC;
            --text: #1F2937;
            --border: #E5E7EB;
            --panel-bg: #FFFFFF;
        }
        [data-theme="sepia"] {
            --bg: #F4ECD8;
            --text: #5C4B37;
            --border: #D4C4A8;
            --panel-bg: #EDE4D0;
        }
        [data-theme="sky"] {
            --bg: #E8F4FC;
            --text: #2C5282;
            --border: #BEE3F8;
            --panel-bg: #E8F4FC;
        }
        [data-theme="green"] {
            --bg: #E8F5E9;
            --text: #2E5A3A;
            --border: #A5D6A7;
            --panel-bg: #E8F5E9;
        }
        [data-theme="dark"] {
            --bg: #1A1F26;
            --text: #E5E7EB;
            --border: #374151;
            --panel-bg: #242B35;
        }
        [data-theme="navy"] {
            --bg: #1A202C;
            --text: #E2E8F0;
            --border: #4A5568;
            --panel-bg: #2D3748;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--bg);
            color: var(--text);
            line-height: var(--line-height);
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 20px 60px 20px;
            transition: background 0.3s, color 0.3s;
        }
        h1 {
            font-size: 1.8em;
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 30px;
            margin-top: 60px;
        }
        p {
            text-indent: 2em;
            margin: 1em 0;
            font-size: var(--font-size);
        }
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: background 0.3s;
        }
        .top-bar a {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }
        .top-bar a:hover {
            text-decoration: underline;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls select, .controls button {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .controls select:hover, .controls button:hover {
            border-color: var(--accent);
        }
        .nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        .nav a {
            color: var(--accent);
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid var(--accent);
            border-radius: 5px;
        }
        .nav a:hover {
            background: var(--accent);
            color: white;
        }
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .back-to-top.visible {
            display: flex;
        }
        @media (max-width: 600px) {
            body { padding: 15px; }
            h1 { font-size: 1.5em; margin-top: 70px; }
            .nav { flex-direction: column; gap: 10px; }
            .nav a { text-align: center; }
            .top-bar { flex-wrap: wrap; gap: 8px; }
        }
    
    
    
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="chapters.html">← 返回目錄</a>
        <div class="controls">
            <select id="themeSelect">
                <option value="light">☀️</option>
                <option value="sepia">📜</option>
                <option value="sky">🌤️</option>
                <option value="green">🌿</option>
                <option value="dark">🌙</option>
                <option value="navy">🌌</option>
            </select>
            <select id="fontSize">
                <option value="14px">A</option>
                <option value="18px" selected>A</option>
                <option value="22px">A</option>
            </select>
        </div>
    </div>
    <h1>第315章 · 鑰匙的共鳴</h1>
    <main>
        <p># 第三百一十五章 · 鑰匙的共鳴</p>
    </main>
    <nav class="nav">
        <a href="https://kofhk.com/chapter-314.html" id="prevLink">← 上一章</a>
        <a href="chapters.html">📖 返回目錄</a>
        <a href="https://kofhk.com/manga/chapter-315/" class="manga-btn">🎨 漫畫版</a>
        <a href="https://kofhk.com/chapter-316.html" id="nextLink">下一章 →</a>
    </nav>
    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
    <script>
        document.getElementById('themeSelect').addEventListener('change', function() {
            document.body.dataset.theme = this.value;
            localStorage.setItem('novelTheme', this.value);
        });
        var savedTheme = localStorage.getItem('novelTheme');
        if (savedTheme) {
            document.body.dataset.theme = savedTheme;
            document.getElementById('themeSelect').value = savedTheme;
        }
        document.getElementById('fontSize').addEventListener('change', function() {
            document.body.style.setProperty('--font-size', this.value);
            localStorage.setItem('novelFont', this.value);
        });
        var savedFont = localStorage.getItem('novelFont');
        if (savedFont) {
            document.body.style.setProperty('--font-size', savedFont);
            document.getElementById('fontSize').value = savedFont;
        }
        window.addEventListener('scroll', function() {
            var btn = document.getElementById('backToTop');
            btn.classList.toggle('visible', window.pageYOffset > 300);
        });
        var prevLink = document.getElementById('prevLink');
        if (!prevLink.href || prevLink.href.includes('#')) {
            prevLink.style.opacity = '0.5';
            prevLink.style.pointerEvents = 'none';
        }
    </script>
</body>
</html>
