<script>(function() {
var chaptersData = [];
var searchBox = document.getElementById('chapterSearch');
var suggestionsEl = document.getElementById('searchSuggestions');
var highlightIndex = -1;
var currentResults = [];
function loadChaptersData() {
var xhr = new XMLHttpRequest();
xhr.open('GET', 'assets/chapters-data.json?v=' + new Date().toISOString().slice(0,10).replace(/-/g,''), true);
xhr.onload = function() {
if (xhr.status === 200) {
try {
chaptersData = JSON.parse(xhr.responseText);
renderLatestChapters();
} catch(e) {
console.warn('Failed to parse chapters-data.json:', e);
}
}
};
xhr.onerror = function() {
console.warn('Failed to load chapters-data.json');
};
xhr.send();
}
loadChaptersData();
if (!searchBox || !suggestionsEl) return;
function renderSuggestions(results) {
suggestionsEl.innerHTML = '';
if (results.length === 0) {
suggestionsEl.innerHTML = '<div class="suggestion-noresult">沒有找到匹配的章節</div>';
suggestionsEl.classList.add('active');
searchBox.setAttribute('aria-expanded', 'true');
return;
}
results.forEach(function(item, i) {
var div = document.createElement('div');
div.className = 'suggestion-item' + (i === highlightIndex ? ' highlight' : '');
div.setAttribute('role', 'option');
div.id = 'suggestion-' + i;
div.setAttribute('aria-selected', i === highlightIndex ? 'true' : 'false');
div.setAttribute('data-num', item.num);
div.innerHTML = '<span class="suggestion-num">第' + item.num + '章</span><span class="suggestion-title">' + item.title + '</span>';
div.addEventListener('click', function() {
goToChapter(item.num);
});
suggestionsEl.appendChild(div);
});
suggestionsEl.classList.add('active');
searchBox.setAttribute('aria-expanded', 'true');
}
function goToChapter(num) {
window.location.href = 'chapter-' + num + '.html';
}
function closeSuggestions() {
suggestionsEl.classList.remove('active');
suggestionsEl.innerHTML = '';
searchBox.setAttribute('aria-expanded', 'false');
searchBox.removeAttribute('aria-activedescendant');
highlightIndex = -1;
currentResults = [];
}
function renderLatestChapters() {
var grid = document.getElementById('chapterGrid');
if (!grid || chaptersData.length === 0) return;
var latest = chaptersData.slice(-6).reverse();
var now = new Date();
var html = '';
latest.forEach(function(ch, i) {
html += '<a href="chapter-' + ch.num + '.html" class="chapter-card">' +
'<div class="chapter-number">第' + ch.num + '章</div>' +
'<h3 class="chapter-title">' + ch.title + '</h3>' +
'<div class="chapter-meta">' +
'<span class="chapter-read">閱讀全文 →</span>' +
'</div>' +
'</a>';
});
grid.innerHTML = html;
var lastUpdateEl = document.getElementById('last-update');
if (lastUpdateEl && latest.length > 0) {
if (document.lastModified) {
var lm = new Date(document.lastModified);
lastUpdateEl.textContent = lm.getFullYear() + '-' +
String(lm.getMonth() + 1).padStart(2, '0') + '-' +
String(lm.getDate()).padStart(2, '0');
}
}
}
searchBox.addEventListener('input', function() {
var q = this.value.trim();
highlightIndex = -1;
if (q === '' || chaptersData.length === 0) {
closeSuggestions();
return;
}
var numVal = parseInt(q, 10);
var results = [];
if (!isNaN(numVal) && numVal > 0 && numVal <= chaptersData.length) {
var exact = chaptersData.filter(function(c) { return c.num === numVal; });
if (exact.length > 0) {
results = exact;
}
}
var titleResults = chaptersData.filter(function(c) {
return c.title.indexOf(q) !== -1;
});
var seenNums = {};
results.forEach(function(r) { seenNums[r.num] = true; });
titleResults.forEach(function(r) {
if (!seenNums[r.num]) {
results.push(r);
}
});
if (!isNaN(numVal) && !results.length) {
var numPrefix = chaptersData.filter(function(c) {
return ('' + c.num).indexOf(q) !== -1;
});
numPrefix.forEach(function(r) {
if (!seenNums[r.num]) {
results.push(r);
}
});
}
results = results.slice(0, 10);
currentResults = results;
renderSuggestions(results);
});
searchBox.addEventListener('keydown', function(e) {
var items = suggestionsEl.querySelectorAll('.suggestion-item');
if (items.length === 0) return;
if (e.key === 'ArrowDown') {
e.preventDefault();
if (highlightIndex < items.length - 1) {
highlightIndex++;
} else {
highlightIndex = 0;
}
items.forEach(function(el, i) {
el.classList.toggle('highlight', i === highlightIndex);
});
if (items[highlightIndex]) {
items[highlightIndex].scrollIntoView({ block: 'nearest' });
}
} else if (e.key === 'ArrowUp') {
e.preventDefault();
if (highlightIndex > 0) {
highlightIndex--;
} else {
highlightIndex = items.length - 1;
}
items.forEach(function(el, i) {
el.classList.toggle('highlight', i === highlightIndex);
});
if (items[highlightIndex]) {
items[highlightIndex].scrollIntoView({ block: 'nearest' });
}
} else if (e.key === 'Enter') {
e.preventDefault();
if (highlightIndex >= 0 && highlightIndex < currentResults.length) {
goToChapter(currentResults[highlightIndex].num);
} else if (currentResults.length === 1) {
goToChapter(currentResults[0].num);
} else {
var q = this.value.trim();
var numVal = parseInt(q, 10);
if (!isNaN(numVal) && numVal > 0 && numVal <= chaptersData.length && chaptersData.length > 0) {
goToChapter(numVal);
}
}

(function() {

function getLatestDate() {
var dates = document.querySelectorAll('.chapter-date');
var latest = null;
dates.forEach(function(el) {
var text = el.textContent.trim();
var match = text.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
if (match) {
var d = new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
if (!latest || d > latest) latest = d;
}
});
return latest;
}
function updateRelativeTime() {
var latest = getLatestDate();
if (!latest) {
if (updateTimeText) updateTimeText.textContent = '載入中...';
setTimeout(updateRelativeTime, 1000);
return;
}
var now = new Date();
var diffMs = now - latest;
var exactStr = latest.getFullYear() + '年' +
(latest.getMonth() + 1) + '月' +
latest.getDate() + '日';
if (updateTimeEl) updateTimeEl.setAttribute('title', '最後更新：' + exactStr);
var seconds = Math.floor(diffMs / 1000);
var minutes = Math.floor(seconds / 60);
var hours = Math.floor(minutes / 60);
var days = Math.floor(hours / 24);
var text = '';
if (seconds < 60) {
text = '剛剛更新';
} else if (minutes < 60) {
text = minutes + ' 分鐘前更新';
} else if (hours < 24) {
text = hours + ' 小時前更新';
} else if (days < 30) {
text = days + ' 天前更新';
} else {
text = exactStr + ' 更新';
}
if (updateTimeText) updateTimeText.textContent = text;
if (lastUpdateEl) {
lastUpdateEl.textContent = exactStr;
}
}
updateRelativeTime();
setInterval(updateRelativeTime, 60000);

<script>document.addEventListener('DOMContentLoaded', function() {
const imageObserver = new IntersectionObserver((entries, observer) => {
entries.forEach(entry => {
if (entry.isIntersecting) {
const img = entry.target;
if (img.dataset.src) {
img.src = img.dataset.src;
img.removeAttribute('data-src');
}
observer.unobserve(img);
}
});
}, {
rootMargin: '50px 0px',
threshold: 0.01
});
document.querySelectorAll('img[data-src]').forEach(img => {
imageObserver.observe(img);
});
if (!('IntersectionObserver' in window)) {
const lazyImages = document.querySelectorAll('img[data-src]');
let lazyImageObserver;
function lazyLoad() {
lazyImages.forEach(img => {
if (img.getBoundingClientRect().top <= window.innerHeight + 100) {
img.src = img.dataset.src;
img.removeAttribute('data-src');
}
});
if (document.querySelectorAll('img[data-src]').length === 0) {
window.removeEventListener('scroll', lazyLoad);
window.removeEventListener('resize', lazyLoad);
}
}
window.addEventListener('scroll', lazyLoad);
window.addEventListener('resize', lazyLoad);
lazyLoad();
}
});</script>
