name: 自動更新 AI Chat Worker 章節索引

on:
  push:
    paths:
      - 'chapter-*.html'
      - 'workers/chat-worker/**'
  schedule:
    # UTC 03:05 = 香港時間 11:05
    - cron: '5 3 * * *'
    # UTC 06:05 = 香港時間 14:05
    - cron: '5 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chat-worker:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 重建章節索引
        run: python build_chapter_index.py

      - name: 檢查是否有變更需要部署
        id: check_changes
        run: |
          INDEX_CHANGED=false
          WORKER_CHANGED=false
          if ! git diff --quiet -- workers/chat-worker/chapter-titles.json; then
            INDEX_CHANGED=true
            echo "章節索引有變更"
          fi
          if ! git diff --quiet HEAD~1 -- workers/chat-worker/index.js workers/chat-worker/wrangler.toml; then
            WORKER_CHANGED=true
            echo "Worker 程式碼有變更"
          fi
          if [ "$INDEX_CHANGED" = "true" ] || [ "$WORKER_CHANGED" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "準備部署 Worker"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "無變更，跳過部署"
          fi

      - name: 設置 Node.js
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝相依套件並部署 Worker
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cd workers/chat-worker
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 提交更新的索引
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- workers/chat-worker/chapter-titles.json; then
            git add workers/chat-worker/chapter-titles.json
            git commit -m "📚 自動更新章節索引 ($(date -u '+%Y-%m-%d %H:%M UTC'))"  || true
            git push
          else
            echo "索引無變更，跳過提交"
          fi
