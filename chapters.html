    <script>
        // 更新最後更新時間
        var lastUpdateElement = document.getElementById('last-update');
        if (lastUpdateElement) {
            lastUpdateElement.textContent = new Date().toLocaleDateString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
        
        // 更新章節總數
        function updateChapterCount() {
            const chapterItems = document.querySelectorAll('.chapter-item');
            document.getElementById('totalChapters').textContent = `共 ${chapterItems.length} 章`;
        }
        
        // 章節排序功能
        function sortChapters(order) {
            const grid = document.getElementById('chapterGrid');
            const items = Array.from(grid.querySelectorAll('.chapter-item'));
            
            // 移除所有按鈕的active類
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 設置當前按鈕為active
            event.target.classList.add('active');
            
            // 排序
            items.sort((a, b) => {
                const aNum = parseInt(a.querySelector('.chapter-num').textContent.match(/\d+/)[0]);
                const bNum = parseInt(b.querySelector('.chapter-num').textContent.match(/\d+/)[0]);
                
                return order === 'desc' ? bNum - aNum : aNum - bNum;
            });
            
            // 重新插入
            items.forEach(item => grid.appendChild(item));
        }
        
        
        
        // 章節分組過濾功能
        function showAllChapters() {
            const grid = document.getElementById('chapterGrid');
            const items = Array.from(grid.querySelectorAll('.chapter-item'));
            
            items.forEach(item => {
                item.style.display = 'flex';
            });
            
            document.querySelectorAll('.group-btn').forEach(b => {
                b.classList.remove('active');
            });
            document.querySelector('.group-btn').classList.add('active');
        }
        
        function filterChapters(range) {
            const grid = document.getElementById('chapterGrid');
            const items = Array.from(grid.querySelectorAll('.chapter-item'));
            
            let min, max;
            if (range.includes('-')) {
                [min, max] = range.split('-').map(Number);
            } else {
                min = max = parseInt(range);
            }
            
            items.forEach(item => {
                const chapterNum = parseInt(item.querySelector('.chapter-num').textContent.match(/\d+/)[0]);
                if (chapterNum >= min && chapterNum <= max) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
            
            // 滾動到頂部
            grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        document.querySelectorAll('.group-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                
                const range = this.textContent;
                
                if (range === '全部') {
                    showAllChapters();
                } else {
                    // 移除所有按鈕的active類
                    document.querySelectorAll('.group-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    
                    // 設置當前按鈕為active
                    this.classList.add('active');
                    
                    filterChapters(range);
                }
            });
        });

        // 初始更新計數
        updateChapterCount();
    </script>

    <!-- 圖片懶加載腳本 -->
    <script>
        // 圖片懶加載實現
        document.addEventListener('DOMContentLoaded', function() {
            // 使用IntersectionObserver API
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.src) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                        }
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '50px 0px',
                threshold: 0.01
            });
            
            // 觀察所有懶加載圖片
            document.querySelectorAll('img[data-src]').forEach(img => {
                imageObserver.observe(img);
            });
            
            // 如果瀏覽器不支持IntersectionObserver，使用備用方案
            if (!('IntersectionObserver' in window)) {
                const lazyImages = document.querySelectorAll('img[data-src]');
                let lazyImageObserver;
                
                // 簡單的滾動檢測
                function lazyLoad() {
                    lazyImages.forEach(img => {
                        if (img.getBoundingClientRect().top <= window.innerHeight + 100) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                        }
                    });
                    
                    // 如果所有圖片都加載了，移除事件監聽
                    if (document.querySelectorAll('img[data-src]').length === 0) {
                        window.removeEventListener('scroll', lazyLoad);
                        window.removeEventListener('resize', lazyLoad);
                    }
                }
                
                window.addEventListener('scroll', lazyLoad);
                window.addEventListener('resize', lazyLoad);
                lazyLoad(); // 初始加載
            }
        });
    </script>

    <script>
        (function() {
            'use strict';
            
            const CHAPTERS_DATA_URL = '/assets/chapters-data.json';
            let allChapters = [];
            let currentSort = 'desc';
            
            async function loadChaptersData() {
                try {
                    const response = await fetch(CHAPTERS_DATA_URL);
                    if (!response.ok) throw new Error('Failed to load chapters data');
                    
                    allChapters = await response.json();
                    console.log(`Loaded ${allChapters.length} chapters`);
                    
                    renderChapterList(allChapters, currentSort);
                    updateTotalCount(allChapters.length);
                } catch (error) {
                    console.error('Error loading chapters:', error);
                    document.getElementById('totalChapters').textContent = '載入失敗';
                }
            }
            
            function renderChapterList(chapters, sort) {
                const gridContent = document.getElementById('chapterGridContent');
                if (!gridContent) return;
                
                let sorted = [...chapters];
                if (sort === 'desc') {
                    sorted.sort((a, b) => b.number - a.number);
                } else {
                    sorted.sort((a, b) => a.number - b.number);
                }
                
                let html = '';
                sorted.forEach(chapter => {
                    const chapterNum = chapter.number;
                    const title = chapter.title.replace(/^第\d+章\s*/, '');
                    const numDisplay = `第${chapterNum}章`;
                    
                    html += `<a href="${chapter.url}" class="chapter-item" aria-label="閱讀${chapter.title}">
                        <div class="chapter-info">
                            <div class="chapter-num">${numDisplay}</div>
                            <div class="chapter-name">${title}</div>
                        </div>
                        <div class="chapter-arrow">→</div>
                    </a>`;
                });
                
                gridContent.innerHTML = html;
            }
            
            function updateTotalCount(count) {
                const totalEl = document.getElementById('totalChapters');
                if (totalEl) {
                    totalEl.textContent = `共 ${count} 章`;
                }
            }
            
            document.addEventListener('DOMContentLoaded', function() {
                loadChaptersData();
                
                const sortBtns = document.querySelectorAll('.sort-btn');
                sortBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        sortBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        
                        const isDesc = this.textContent.includes('最新');
                        currentSort = isDesc ? 'desc' : 'asc';
                        
                        if (allChapters.length > 0) {
                            renderChapterList(allChapters, currentSort);
                        }
                    });
                });
            });
        })();
    </script>
