const DATA_URL = 'assets/chapters-data.json?v=' + new Date().toISOString().slice(0,10).replace(/-/g,'');

const LS_READ = 'readChapters';
const LS_BOOKMARKS = 'bookmarks';
const VOLUMES = [

{id:2, name:'第二卷', subtitle:'化物', start:501, end:675},

{id:4, name:'第四卷', subtitle:'嬰變九轉', start:926, end:1190},
{id:5, name:'第五卷', subtitle:'悟天', start:1191, end:1460},
{id:6, name:'第六卷', subtitle:'掌命', start:1461, end:1740},
{id:7, name:'第七卷', subtitle:'破虛', start:1741, end:2030},
{id:8, name:'第八卷', subtitle:'造界', start:2031, end:2330},
{id:9, name:'第九卷', subtitle:'超脫', start:2331, end:2640},

];
let allChapters = [];

let totalPages = 1;
let searchTimer = null;

let bookmarkFilterActive = false;
function getReadSet(){
try{return new Set(JSON.parse(localStorage.getItem(LS_READ)||'[]'));}catch(e){return new Set();}
}
function saveReadSet(set){
localStorage.setItem(LS_READ, JSON.stringify([...set]));
}
function isRead(num){return getReadSet().has(num);}
function toggleRead(num){
var set = getReadSet();
if(set.has(num)) set.delete(num); else set.add(num);
saveReadSet(set);
return set.has(num);
}
function getBookmarkSet(){
try{return new Set(JSON.parse(localStorage.getItem(LS_BOOKMARKS)||'[]'));}catch(e){return new Set();}
}
function saveBookmarkSet(set){
localStorage.setItem(LS_BOOKMARKS, JSON.stringify([...set]));
}
function isBookmarked(num){return getBookmarkSet().has(num);}
function toggleBookmark(num){
var set = getBookmarkSet();
if(set.has(num)) set.delete(num); else set.add(num);
saveBookmarkSet(set);
return set.has(num);
}
function updateProgressBar(){
var total = allChapters.length;
var readCount = getReadSet().size;
var pct = total > 0 ? Math.round((readCount/total)*100) : 0;
var elFill = document.getElementById('progressBarFill');
var elText = document.getElementById('progressText');
if(elFill) elFill.style.width = pct+'%';
if(elText) elText.textContent = '已讀 '+readCount+'/'+total+' 章 · '+pct+'%';
}
function getNewBadgeThresholds(){
if(allChapters.length === 0) return {newMin:9999, hotMin:9999};
var maxNum = allChapters.reduce(function(m,c){return c.num > m ? c.num : m;}, 0);
var sortedByNum = allChapters.slice().sort(function(a,b){return a.num - b.num;});
var hotMin = 9999;
if(sortedByNum.length >= 6){
hotMin = sortedByNum[sortedByNum.length - 6].num;
}else if(sortedByNum.length > 0){
hotMin = sortedByNum[0].num;
}
var newMin = maxNum - 20;
return {newMin: newMin, hotMin: hotMin};
}

try{

}catch(e){

buildVolTabs();
updateHero();
updateProgressBar();
applyFilters();
bindEvents();
handleHash();
syncFilterBtnStates();
}
function buildVolTabs(){
var container = document.getElementById('volTabs');
var html = '<button class="vol-tab active" data-vol="0">全部<span class="vol-count">('+allChapters.length+')</span></button>';
VOLUMES.forEach(function(v){
var count = allChapters.filter(function(c){return c.num >= v.start && c.num <= v.end;}).length;
if(count > 0){
html += '<button class="vol-tab" data-vol="'+v.id+'">'+v.name+'<span class="vol-count">('+count+')</span></button>';
}
});
container.innerHTML = html;
}
function updateHero(){
document.getElementById('heroTotal').textContent = allChapters.length;
var activeVols = VOLUMES.filter(function(v){
return allChapters.some(function(c){return c.num >= v.start && c.num <= v.end;});
});
document.getElementById('heroVols').textContent = activeVols.length || 1;
}
function applyFilters(){
var searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
var chs = allChapters;
if(currentVol > 0){
var vdef = VOLUMES.find(function(v){return v.id === currentVol;});
if(vdef){
chs = chs.filter(function(c){return c.num >= vdef.start && c.num <= vdef.end;});
}
}
if(searchTerm){
var numSearch = parseInt(searchTerm, 10);
if(!isNaN(numSearch)){
chs = chs.filter(function(c){return c.num === numSearch;});
} else {
chs = chs.filter(function(c){return c.title.toLowerCase().includes(searchTerm);});
}
}
if(readFilterActive){
var readSet = getReadSet();
chs = chs.filter(function(c){return readSet.has(c.num);});
}
if(bookmarkFilterActive){
var bmSet = getBookmarkSet();
chs = chs.filter(function(c){return bmSet.has(c.num);});
}
filteredChapters = chs;
currentPage = 1;
totalPages = Math.ceil(filteredChapters.length / PER_PAGE) || 1;
updateResultInfo();
renderPage();
}
function updateResultInfo(){
var el = document.getElementById('resultInfo');
if(!el) return;
var search = document.getElementById('searchInput').value.trim();
if(search){
el.textContent = '找到 '+filteredChapters.length+' 章';
} else if(readFilterActive || bookmarkFilterActive){
el.textContent = '篩選結果 '+filteredChapters.length+' 章';
} else {
el.textContent = '';
}
}
function getSorted(){
var s = filteredChapters.slice();
s.sort(function(a,b){return currentSort==='desc'?b.num-a.num:a.num-b.num;});
return s;
}
function renderPage(){
var grid = document.getElementById('chapterGrid');
var sorted = getSorted();
var start = (currentPage-1)*PER_PAGE;
var page = sorted.slice(start, start+PER_PAGE);
var thresholds = getNewBadgeThresholds();
if(page.length === 0){
grid.innerHTML = '<div class="chapter-empty"><div class="icon">🔍</div><p>沒有找到相關章節</p></div>';
} else {
var html = '';
page.forEach(function(ch){
var title = ch.title.replace(/^第\d+章[：:]\s*/, '');
var read = isRead(ch.num);
var bm = isBookmarked(ch.num);
var isNew = ch.num >= thresholds.newMin;
var isHot = ch.num >= thresholds.hotMin;
var itemClass = 'chapter-item' + (read ? ' read-chapter' : '');
html += '<a href="chapter-'+ch.num+'.html" class="'+itemClass+'" data-chapter="'+ch.num+'">'+
'<span class="chapter-num">'+
(read ? '<span class="chapter-read-indicator read">✅</span>' : '')+
'第'+ch.num+'章'+
'</span>'+
'<span class="chapter-name">'+
escHtml(title)+
(isHot ? '<span class="chapter-new-badge">🆕 新章節</span>' : isNew ? '<span class="chapter-new-badge">🆕</span>' : '')+
'</span>'+
'<span class="chapter-actions">'+
'<button class="chapter-bookmark-btn'+(bm?' bookmarked':'')+'" data-chapter="'+ch.num+'" title="'+(bm?'移除書籤':'加入書籤')+'">'+(bm?'★':'☆')+'</button>'+
'<span class="chapter-arrow">→</span>'+
'</span></a>';
});
grid.innerHTML = html;
}
renderPagination();
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderPagination(){
var container = document.getElementById('pagination');
if(totalPages <= 1){
container.innerHTML = '';
return;
}
var html = '';
html += '<button class="page-btn" data-page="'+(currentPage-1)+'"'+(currentPage===1?' disabled':'')+'>‹</button>';
var maxShow = 7;
var startP = Math.max(1, currentPage-3);
var endP = Math.min(totalPages, startP+maxShow-1);
if(endP-startP < maxShow-1) startP = Math.max(1, endP-maxShow+1);
if(startP > 1){
html += '<button class="page-btn" data-page="1">1</button>';
if(startP > 2) html += '<span class="page-btn" style="border:none;cursor:default">…</span>';
}
for(var i=startP; i<=endP; i++){
html += '<button class="page-btn'+(i===currentPage?' active':'')+'" data-page="'+i+'">'+i+'</button>';
}
if(endP < totalPages){
if(endP < totalPages-1) html += '<span class="page-btn" style="border:none;cursor:default">…</span>';
html += '<button class="page-btn" data-page="'+totalPages+'">'+totalPages+'</button>';
}
html += '<button class="page-btn" data-page="'+(currentPage+1)+'"'+(currentPage===totalPages?' disabled':'')+'>›</button>';
html += '<span class="page-jump">跳至<input type="number" id="pageJumpInput" min="1" max="'+totalPages+'" placeholder="'+currentPage+'">頁</span>';
container.innerHTML = html;
}
function syncFilterBtnStates(){
var readBtn = document.getElementById('readFilterBtn');
var bmBtn = document.getElementById('bookmarkFilterBtn');
if(readBtn) readBtn.classList.toggle('active', readFilterActive);
if(bmBtn) bmBtn.classList.toggle('active', bookmarkFilterActive);
}
function handleHash(){
var hash = location.hash;
if(!hash) return;
var m = hash.match(/^#group-(\d+)-(\d+)$/);
if(!m) {
var vm = hash.match(/^#vol-(\d+)$/);
if(vm && allChapters.length){
var vid = parseInt(vm[1]);
selectVolume(vid);
}
return;
}
var target = parseInt(m[1]);
if(isNaN(target) || target < 1 || !allChapters.length) return;
var foundVol = 0;
VOLUMES.forEach(function(v){
if(target >= v.start && target <= v.end) foundVol = v.id;
});
if(foundVol > 0) selectVolume(foundVol);
}
function selectVolume(vid){
currentVol = vid;
currentPage = 1;
document.querySelectorAll('.vol-tab').forEach(function(t){
t.classList.toggle('active', parseInt(t.dataset.vol)===vid);
});
applyFilters();
}
function bindEvents(){
document.getElementById('volTabs').addEventListener('click', function(e){
var tab = e.target.closest('.vol-tab');
if(!tab) return;
var vid = parseInt(tab.dataset.vol);
selectVolume(vid);
});
document.querySelectorAll('.sort-btn:not(.filter-btn)').forEach(function(btn){
btn.addEventListener('click', function(){
document.querySelectorAll('.sort-btn:not(.filter-btn)').forEach(function(b){b.classList.remove('active');});
this.classList.add('active');
currentSort = this.dataset.sort;
currentPage = 1;
renderPage();
});
});
document.getElementById('searchInput').addEventListener('input', function(){
clearTimeout(searchTimer);
searchTimer = setTimeout(function(){
applyFilters();
}, 300);
});
document.getElementById('readFilterBtn').addEventListener('click', function(){
readFilterActive = !readFilterActive;
this.classList.toggle('active', readFilterActive);
if(readFilterActive && bookmarkFilterActive){
bookmarkFilterActive = false;
document.getElementById('bookmarkFilterBtn').classList.remove('active');
}
applyFilters();
});
document.getElementById('bookmarkFilterBtn').addEventListener('click', function(){
bookmarkFilterActive = !bookmarkFilterActive;
this.classList.toggle('active', bookmarkFilterActive);
if(bookmarkFilterActive && readFilterActive){
readFilterActive = false;
document.getElementById('readFilterBtn').classList.remove('active');
}
applyFilters();
});
document.getElementById('pagination').addEventListener('click', function(e){
var btn = e.target.closest('.page-btn');
if(!btn || btn.disabled) return;
var p = parseInt(btn.dataset.page);
if(p >= 1 && p <= totalPages && p !== currentPage){
currentPage = p;
renderPage();
document.getElementById('chapterGrid').scrollIntoView({behavior:'smooth',block:'start'});
}
});
document.getElementById('pagination').addEventListener('keydown', function(e){
if(e.target.id === 'pageJumpInput' && e.key === 'Enter'){
var p = parseInt(e.target.value);
if(p >= 1 && p <= totalPages){
currentPage = p;
renderPage();
document.getElementById('chapterGrid').scrollIntoView({behavior:'smooth',block:'start'});
}
e.target.value = '';
}
});
document.getElementById('quickJumpBtn').addEventListener('click', function(){
jumpToChapter();
});
document.getElementById('quickJumpInput').addEventListener('keydown', function(e){
if(e.key === 'Enter') jumpToChapter();
});
function jumpToChapter(){
var num = parseInt(document.getElementById('quickJumpInput').value, 10);
if(num >= 1 && num <= (allChapters.length > 0 ? allChapters[allChapters.length-1].num : 9999)){
window.location.href = 'chapter-'+num+'.html';
} else {
document.getElementById('quickJumpInput').style.borderColor = '#ef4444';
setTimeout(function(){
document.getElementById('quickJumpInput').style.borderColor = '';
}, 1500);
}
}
document.getElementById('scrollTopBtn').addEventListener('click', function(){
window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('scrollBottomBtn').addEventListener('click', function(){
window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
});
window.addEventListener('hashchange', handleHash);
document.getElementById('chapterGrid').addEventListener('click', function(e){
var bmBtn = e.target.closest('.chapter-bookmark-btn');
if(bmBtn){
e.preventDefault();
e.stopPropagation();
var chNum = parseInt(bmBtn.dataset.chapter, 10);
var newBm = toggleBookmark(chNum);
bmBtn.textContent = newBm ? '★' : '☆';
bmBtn.classList.toggle('bookmarked', newBm);
bmBtn.title = newBm ? '移除書籤' : '加入書籤';
updateProgressBar();
if(bookmarkFilterActive){
applyFilters();
}
}
});
document.getElementById('chapterGrid').addEventListener('click', function(e){
var link = e.target.closest('a.chapter-item');
if(link && !e.target.closest('.chapter-bookmark-btn')){
var chNum = parseInt(link.dataset.chapter, 10);
var wasRead = isRead(chNum);
if(!wasRead){
var set = getReadSet();
set.add(chNum);
saveReadSet(set);
updateProgressBar();
}
}
});
window.addEventListener('storage', function(e){
if(e.key === LS_READ || e.key === LS_BOOKMARKS){
updateProgressBar();
if(readFilterActive || bookmarkFilterActive){
applyFilters();
}else{
renderPage();
}
}
});
}
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', init);
} else {
init();
}
})();</script>
