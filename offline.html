<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>離線模式 - 科技修真傳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #FFD700;
            font-family: 'Noto Serif TC', serif;
        }
        
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, background 0.3s;
        }
        
        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: #6366F1;
        }
        
        .feature-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }
        
        .feature-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            min-width: 150px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .offline-content {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }
        
        .offline-content h3 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .chapter-list {
            list-style: none;
            margin-top: 15px;
        }
        
        .chapter-list li {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 3px solid #6366F1;
        }
        
        .chapter-list li:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <meta property="og:title" content="離線模式 - 科技修真傳">
    <meta property="og:description" content="科技修真傳 - 當科技與修仙相遇，會擦出怎樣的火花？">
    <meta property="og:image" content="assets/book-cover.png">
    <meta property="og:url" content="https://kofhk.com/offline.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="離線模式 - 科技修真傳">
    <meta name="twitter:description" content="科技修真傳 - 當科技與修仙相遇，會擦出怎樣的火花？">
    <meta name="twitter:image" content="assets/book-cover.png">
    <meta name="description" content="科技修真傳 - 當科技與修仙相遇，會擦出怎樣的火花？林塵在末法時代覺醒靈芯，開啟修真之路，融合科幻與修真元素的長篇小說。"></head>
<body>
    <!-- Skip Navigation Link -->
    <a href="#main-content" class="skip-navigation" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:-1;">跳到主要內容</a>
    <div class="container" id="main-content">
        <div class="icon">📚</div>
        <h1>離線模式</h1>
        <p>您目前處於離線狀態，但不用擔心！部分內容仍然可以訪問。</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📖</div>
                <div class="feature-title">緩存內容</div>
                <div class="feature-desc">核心章節已緩存，可離線閱讀</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">快速加載</div>
                <div class="feature-desc">從本地緩存加載，速度更快</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔔</div>
                <div class="feature-title">更新通知</div>
                <div class="feature-desc">恢復網絡後自動獲取新內容</div>
            </div>
        </div>
        
        <div class="offline-content">
            <h3>可離線訪問的內容：</h3>
            <ul class="chapter-list">
                <li>首頁和網站導航</li>
                <li>最新章節（已緩存部分）</li>
                <li>作者介紹和網站信息</li>
                <li>基本功能界面</li>
            </ul>
        </div>
        
        <div class="actions">
            <button aria-label="返回首頁" class="btn btn-primary" onclick="window.location.href='home.html'">返回首頁</button>
            <button aria-label="重試連接" class="btn btn-secondary" onclick="location.reload()">重試連接</button>
            <button aria-label="查看緩存章節" class="btn btn-secondary" onclick="showOfflineChapters()">查看緩存章節</button>
        </div>
    </div>
    
    <script>
        // 檢查網絡狀態
        function checkNetworkStatus() {
            if (navigator.onLine) {
                console.log('網絡已恢復，重新加載頁面...');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);
            }
        }
        
        // 顯示緩存章節
        function showOfflineChapters() {
            alert('緩存章節功能正在開發中...\n\n目前可訪問：\n• 首頁 (home.html)\n• 章節目錄 (chapters.html)\n• 作者介紹 (author.html)');
        }
        
        // 監聽網絡狀態變化
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', () => {
            console.log('網絡已斷開');
        });
        
        // 初始檢查
        checkNetworkStatus();
        
        // 註冊Service Worker（如果支持）
        }
    </script>
</body>
</html>
