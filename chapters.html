/* Hero */

}

<!-- Core Chapter Renderer -->
<script>
(function(){
'use strict';
const DATA_URL = 'assets/chapters-data.json?v=20260711v2';
const PER_PAGE = 20;

// Volume definitions
const VOLUMES = [
  {id:1, name:'第一卷', subtitle:'感氣→元嬰', start:1, end:500},
  {id:2, name:'第二卷', subtitle:'化物', start:501, end:675},
  {id:3, name:'第三卷', subtitle:'歸真', start:676, end:925},
  {id:4, name:'第四卷', subtitle:'嬰變九轉', start:926, end:1190},
  {id:5, name:'第五卷', subtitle:'悟天', start:1191, end:1460},
  {id:6, name:'第六卷', subtitle:'掌命', start:1461, end:1740},
  {id:7, name:'第七卷', subtitle:'破虛', start:1741, end:2030},
  {id:8, name:'第八卷', subtitle:'造界', start:2031, end:2330},
  {id:9, name:'第九卷', subtitle:'超脫', start:2331, end:2640},
  {id:10, name:'第十卷', subtitle:'永恆→結局', start:2641, end:3000}
];

let allChapters = [];
let filteredChapters = [];
let currentVol = 0; // 0 = all
let currentSort = 'desc';
let currentPage = 1;
let totalPages = 1;
let searchTimer = null;

// --- Data loading ---
async function init(){
  try{
    var r = await fetch(DATA_URL);
    if(!r.ok) throw new Error('load failed');
    allChapters = await r.json();
  }catch(e){
    document.getElementById('chapterGrid').innerHTML = '<div class="chapter-empty"><div class="icon">📭</div><p>載入失敗，請稍後再試</p></div>';
    return;
  }
  buildVolTabs();
  updateHero();
  applyFilters();
  bindEvents();
  handleHash();
}

// --- Volume Tabs ---
function buildVolTabs(){
  var container = document.getElementById('volTabs');
  var html = '<button class="vol-tab active" data-vol="0">全部<span class="vol-count">('+allChapters.length+')</span></button>';
  VOLUMES.forEach(function(v){
    var count = allChapters.filter(function(c){return c.num >= v.start && c.num <= v.end;}).length;
    if(count > 0){
      html += '<button class="vol-tab" data-vol="'+v.id+'">'+v.name+'<span class="vol-count">('+count+')</span></button>';
    }
  });
  container.innerHTML = html;
}

function updateHero(){
  document.getElementById('heroTotal').textContent = allChapters.length;
  var activeVols = VOLUMES.filter(function(v){
    return allChapters.some(function(c){return c.num >= v.start && c.num <= v.end;});
  });
  document.getElementById('heroVols').textContent = activeVols.length || 1;
}

// --- Filtering ---
function applyFilters(){
  var searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  var chs = allChapters;

  // Volume filter
  if(currentVol > 0){
    var vdef = VOLUMES.find(function(v){return v.id === currentVol;});
    if(vdef){
      chs = chs.filter(function(c){return c.num >= vdef.start && c.num <= vdef.end;});
    }
  }

  // Search filter
  if(searchTerm){
    // Check if it's a number (chapter number search)
    var numSearch = parseInt(searchTerm, 10);
    if(!isNaN(numSearch)){
      chs = chs.filter(function(c){return c.num === numSearch;});
    } else {
      chs = chs.filter(function(c){return c.title.toLowerCase().includes(searchTerm);});
    }
  }

  filteredChapters = chs;
  currentPage = 1;
  totalPages = Math.ceil(filteredChapters.length / PER_PAGE) || 1;
  updateResultInfo();
  renderPage();
}

function updateResultInfo(){
  var el = document.getElementById('resultInfo');
  if(!el) return;
  var search = document.getElementById('searchInput').value.trim();
  if(search){
    el.textContent = '找到 '+filteredChapters.length+' 章';
  } else {
    el.textContent = '';
  }
}

// --- Rendering ---
function getSorted(){
  var s = filteredChapters.slice();
  s.sort(function(a,b){return currentSort==='desc'?b.num-a.num:a.num-b.num;});
  return s;
}

function renderPage(){
  var grid = document.getElementById('chapterGrid');
  var sorted = getSorted();
  var start = (currentPage-1)*PER_PAGE;
  var page = sorted.slice(start, start+PER_PAGE);

  if(page.length === 0){
    grid.innerHTML = '<div class="chapter-empty"><div class="icon">🔍</div><p>沒有找到相關章節</p></div>';
  } else {
    var html = '';
    page.forEach(function(ch){
      var title = ch.title.replace(/^第\d+章[：:]\s*/, '');
      html += '<a href="chapter-'+ch.num+'.html" class="chapter-item">'+
        '<span class="chapter-num">第'+ch.num+'章</span>'+
        '<span class="chapter-name">'+escHtml(title)+'</span>'+
        '<span class="chapter-arrow">→</span></a>';
    });
    grid.innerHTML = html;
  }
  renderPagination();
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderPagination(){
  var container = document.getElementById('pagination');
  if(totalPages <= 1){
    container.innerHTML = '';
    return;
  }
  var html = '';
  html += '<button class="page-btn" data-page="'+(currentPage-1)+'"'+(currentPage===1?' disabled':'')+'>‹</button>';
  var maxShow = 7;
  var startP = Math.max(1, currentPage-3);
  var endP = Math.min(totalPages, startP+maxShow-1);
  if(endP-startP < maxShow-1) startP = Math.max(1, endP-maxShow+1);
  if(startP > 1){
    html += '<button class="page-btn" data-page="1">1</button>';
    if(startP > 2) html += '<span class="page-btn" style="border:none;cursor:default">…</span>';
  }
  for(var i=startP; i<=endP; i++){
    html += '<button class="page-btn'+(i===currentPage?' active':'')+'" data-page="'+i+'">'+i+'</button>';
  }
  if(endP < totalPages){
    if(endP < totalPages-1) html += '<span class="page-btn" style="border:none;cursor:default">…</span>';
    html += '<button class="page-btn" data-page="'+totalPages+'">'+totalPages+'</button>';
  }
  html += '<button class="page-btn" data-page="'+(currentPage+1)+'"'+(currentPage===totalPages?' disabled':'')+'>›</button>';
  html += '<span class="page-jump">跳至<input type="number" id="pageJumpInput" min="1" max="'+totalPages+'" placeholder="'+currentPage+'">頁</span>';
  container.innerHTML = html;
}

// --- Hash handling (for backwards compat) ---
function handleHash(){
  var hash = location.hash;
  if(!hash) return;
  var m = hash.match(/^#group-(\d+)-(\d+)$/);
  if(!m) {
    // Check for volume hash: #vol-N
    var vm = hash.match(/^#vol-(\d+)$/);
    if(vm && allChapters.length){
      var vid = parseInt(vm[1]);
      selectVolume(vid);
    }
    return;
  }
  var target = parseInt(m[1]);
  if(isNaN(target) || target < 1 || !allChapters.length) return;
  // Find which volume contains this chapter
  var foundVol = 0;
  VOLUMES.forEach(function(v){
    if(target >= v.start && target <= v.end) foundVol = v.id;
  });
  if(foundVol > 0) selectVolume(foundVol);
}

function selectVolume(vid){
  currentVol = vid;
  currentPage = 1;
  document.querySelectorAll('.vol-tab').forEach(function(t){
    t.classList.toggle('active', parseInt(t.dataset.vol)===vid);
  });
  applyFilters();
}

// --- Events ---
function bindEvents(){
  // Volume tabs
  document.getElementById('volTabs').addEventListener('click', function(e){
    var tab = e.target.closest('.vol-tab');
    if(!tab) return;
    var vid = parseInt(tab.dataset.vol);
    selectVolume(vid);
  });

  // Sort buttons
  document.querySelectorAll('.sort-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});
      this.classList.add('active');
      currentSort = this.dataset.sort;
      currentPage = 1;
      renderPage();
    });
  });

  // Search input (debounced)
  document.getElementById('searchInput').addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      applyFilters();
    }, 300);
  });

  // Pagination clicks
  document.getElementById('pagination').addEventListener('click', function(e){
    var btn = e.target.closest('.page-btn');
    if(!btn || btn.disabled) return;
    var p = parseInt(btn.dataset.page);
    if(p >= 1 && p <= totalPages && p !== currentPage){
      currentPage = p;
      renderPage();
      document.getElementById('chapterGrid').scrollIntoView({behavior:'smooth',block:'start'});
    }
  });

  // Page jump
  document.getElementById('pagination').addEventListener('keydown', function(e){
    if(e.target.id === 'pageJumpInput' && e.key === 'Enter'){
      var p = parseInt(e.target.value);
      if(p >= 1 && p <= totalPages){
        currentPage = p;
        renderPage();
        document.getElementById('chapterGrid').scrollIntoView({behavior:'smooth',block:'start'});
      }
      e.target.value = '';
    }
  });

  // Quick jump
  document.getElementById('quickJumpBtn').addEventListener('click', function(){
    jumpToChapter();
  });
  document.getElementById('quickJumpInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') jumpToChapter();
  });

  function jumpToChapter(){
    var num = parseInt(document.getElementById('quickJumpInput').value, 10);
    if(num >= 1 && num <= (allChapters.length > 0 ? allChapters[allChapters.length-1].num : 9999)){
      window.location.href = 'chapter-'+num+'.html';
    } else {
      document.getElementById('quickJumpInput').style.borderColor = '#ef4444';
      setTimeout(function(){
        document.getElementById('quickJumpInput').style.borderColor = '';
      }, 1500);
    }
  }

  // Scroll buttons
  document.getElementById('scrollTopBtn').addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('scrollBottomBtn').addEventListener('click', function(){
    window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  });

  // Hash change
  window.addEventListener('hashchange', handleHash);
}

// Start
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
